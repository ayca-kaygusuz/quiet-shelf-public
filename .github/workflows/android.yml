name: Android application
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the verified Android APK to the matching published release
        type: boolean
        default: false
      verifiedRunId:
        description: Optional successful Android run from this exact commit; reuse its tested artifact instead of rebuilding
        type: string
        default: ''
      googleAndroidClientId:
        description: Public Android OAuth client ID, for build configuration validation
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ayca-kaygusuz/quiet-shelf-public' && github.event.repository.private == false && !inputs.verifiedRunId
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QUIET_SHELF_GOOGLE_ANDROID_CLIENT_ID: ${{ inputs.googleAndroidClientId || vars.QUIET_SHELF_GOOGLE_ANDROID_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Shared regression checks
        run: npm test
      - name: Prepare Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12700392'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build Android app
        env:
          QUIET_SHELF_ANDROID_KEYSTORE_BASE64: ${{ secrets.QUIET_SHELF_ANDROID_KEYSTORE_BASE64 }}
          QUIET_SHELF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QUIET_SHELF_ANDROID_KEYSTORE_PASSWORD }}
        run: node scripts/build-android.mjs ${{ inputs.publish && '--release' || '' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android runtime
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.quietshelf.android.test/androidx.test.runner.AndroidJUnitRunner > work/android/instrumentation-results.txt
            cat work/android/instrumentation-results.txt
            node -e "const s=require('fs').readFileSync('work/android/instrumentation-results.txt','utf8');if(!/OK \(\d+ tests?\)/.test(s)||/FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=Process crashed/.test(s))throw Error('Android instrumentation did not pass');"
            adb pull /sdcard/Android/data/com.quietshelf.android/files/previews work/android/previews
      - name: Keep Android package briefly
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quiet-shelf-android
          retention-days: 1
          if-no-files-found: error
          path: |
            work/android/Quiet-Shelf-Android-*.apk
            work/android/SHA256SUMS-Android.txt
            work/android/android-signing-certificate.txt
            work/android/android-build.json
      - name: Keep runtime results briefly
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quiet-shelf-android-previews
          retention-days: 1
          if-no-files-found: warn
          path: |
            work/android/previews/*.png
            work/android/instrumentation-results.txt
            android/app/build/reports/androidTests/connected/**
            android/app/build/reports/lint-results-release.html
  publish:
    if: always() && github.repository == 'ayca-kaygusuz/quiet-shelf-public' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && (needs.build.result == 'success' || needs.build.result == 'skipped' && inputs.verifiedRunId != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate previously tested run
        if: inputs.verifiedRunId != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN_ID: ${{ inputs.verifiedRunId }}
        run: |
          [[ "$VERIFIED_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid Android run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" > android-run.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('android-run.json'));if(r.conclusion!=='success'||r.head_sha!==process.env.GITHUB_SHA||r.path!=='.github/workflows/android.yml')throw Error('The Android artifact must come from a successful run of this workflow at the exact release commit.');"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: quiet-shelf-android
          path: release-android
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verifiedRunId || github.run_id }}
      - name: Attach tested Android app to matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const m=JSON.parse(fs.readFileSync('release-android/android-build.json'));const version=JSON.parse(fs.readFileSync('package.json')).version;if(m.version!==version||m.filename!=='Quiet-Shelf-Android-'+version+'.apk')throw Error('Android version mismatch');if(!m.signed||m.sourceSha!==process.env.GITHUB_SHA)throw Error('Unsigned or mismatched Android artifact');const b=fs.readFileSync('release-android/'+m.filename);if(crypto.createHash('sha256').update(b).digest('hex')!==m.sha256)throw Error('APK checksum mismatch');"
          ready=false
          for attempt in $(seq 1 60); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null && [ "$(node -p "require('./release-state.json').isDraft")" = false ]; then
              ready=true
              break
            fi
            sleep 10
          done
          [ "$ready" = true ] || { echo 'The matching Windows/browser release has not finished. Android APK remains available as an artifact.'; exit 1; }
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          [ "$release_sha" = "$GITHUB_SHA" ] || { echo 'Release/source mismatch; preserving the existing release.'; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir release-android
          export ANDROID_RELEASE_VERSION="$version"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > android-release-assets.json
          if node --input-type=module -e "import fs from 'node:fs';const a=JSON.parse(fs.readFileSync('android-release-assets.json')).assets;process.exit(a.some(x=>x.name==='Quiet-Shelf-Android-'+process.env.ANDROID_RELEASE_VERSION+'.apk')?0:1);"; then
            mkdir existing-android
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "Quiet-Shelf-Android-$version.apk" --dir existing-android
            cmp "existing-android/Quiet-Shelf-Android-$version.apk" "release-android/Quiet-Shelf-Android-$version.apk" || { echo 'This version already has a different published Android APK. Bump the version.'; exit 1; }
          fi
          node --input-type=module -e "import fs from 'node:fs';const name='Quiet-Shelf-Android-'+process.env.ANDROID_RELEASE_VERSION+'.apk';const file='release-android/SHA256SUMS.txt';const lines=fs.readFileSync(file,'utf8').split(/\r?\n/).filter(x=>x.trim()&&!x.trim().endsWith('  '+name));fs.writeFileSync(file,lines.join('\n')+'\n'+fs.readFileSync('release-android/SHA256SUMS-Android.txt','utf8'));"
          gh release upload "$tag" release-android/Quiet-Shelf-Android-*.apk release-android/android-signing-certificate.txt release-android/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
