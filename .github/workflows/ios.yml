name: iPhone and iPad application
on:
  workflow_dispatch:
    inputs:
      googleIosClientId:
        description: Public iOS OAuth client ID; never an OAuth secret or plist
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ayca-kaygusuz/quiet-shelf-public' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      QUIET_SHELF_GOOGLE_IOS_CLIENT_ID: ${{ inputs.googleIosClientId || vars.QUIET_SHELF_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Resolve pinned Google native SDK and retain its notices
        run: |
          set -euo pipefail
          node scripts/build-ios.mjs resolve
          python3 scripts/ios-notices.py
          echo "QUIET_SHELF_IOS_NOTICES=$GITHUB_WORKSPACE/work/ios/native-notices.txt" >> "$GITHUB_ENV"
      - name: Test native iPad and iPhone runtimes
        run: |
          set -euo pipefail
          python3 scripts/test-ios-simulators.py
      - name: Build unsigned universal device IPA
        run: npm run build:ios
      - name: Verify universal IPA and retained licenses
        run: python3 scripts/check-ios-package.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-unsigned-package
          path: |
            work/ios/*-unsigned.ipa
            work/ios/INSTALL-iPhone-iPad.md
            work/ios/ios-build.json
            work/ios/native-notices.txt
            ios/QuietShelf.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 1
      - name: Retain native runtime results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-runtime-results
          path: |
            work/ios/*runtime.xcresult
            work/ios/simulator-results.json
          retention-days: 1
