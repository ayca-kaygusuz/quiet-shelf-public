name: Windows application

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows.yml"
      - "assets/**"
      - "desktop/**"
      - "!desktop/*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer as a GitHub release
        type: boolean
        default: false
      googleDesktopClientId:
        description: Public Desktop OAuth client ID (optional; otherwise use repository variable)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Standard public-repository runners are free; never start a private-repo VM.
    if: github.repository == 'ayca-kaygusuz/quiet-shelf-public' && github.event.repository.private == false
    runs-on: windows-latest
    env:
      QUIET_SHELF_GOOGLE_DESKTOP_CLIENT_ID: ${{ inputs.googleDesktopClientId || vars.QUIET_SHELF_GOOGLE_DESKTOP_CLIENT_ID }}
      QUIET_SHELF_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.QUIET_SHELF_GOOGLE_DESKTOP_CLIENT_SECRET }}
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.installer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate release Google client configuration
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: node scripts/check-google-release.mjs
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Prepare verified Windows build tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'quiet-shelf-tools'
          New-Item -ItemType Directory -Force $toolRoot | Out-Null
          $electronVersion = node -p "require('./package.json').devDependencies.electron"
          $archiveName = "electron-v$electronVersion-win32-x64.zip"
          gh release download "v$electronVersion" --repo electron/electron --pattern $archiveName --pattern SHASUMS256.txt --dir $toolRoot
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime download failed.' }
          $hashLine = Get-Content (Join-Path $toolRoot 'SHASUMS256.txt') | Where-Object { $_.TrimEnd().EndsWith($archiveName) }
          $expected = ($hashLine -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $toolRoot $archiveName) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Electron runtime checksum mismatch.' }
          Expand-Archive (Join-Path $toolRoot $archiveName) (Join-Path $toolRoot 'electron')
          gh release download 'nsis@1.2.1' --repo electron-userland/electron-builder-binaries --pattern nsis-bundle-3.12.tar.gz --dir $toolRoot
          if ($LASTEXITCODE -ne 0) { throw 'NSIS tool download failed.' }
          $actual = (Get-FileHash (Join-Path $toolRoot 'nsis-bundle-3.12.tar.gz') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '56997fdefe25e7928a1a68b4583d08b240b66cf660234053b20131a74cc082f4') { throw 'NSIS tool checksum mismatch.' }
          New-Item -ItemType Directory -Force (Join-Path $toolRoot 'nsis') | Out-Null
          tar -xzf (Join-Path $toolRoot 'nsis-bundle-3.12.tar.gz') -C (Join-Path $toolRoot 'nsis')
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed.' }
          Add-Content $env:GITHUB_ENV "QUIET_SHELF_ELECTRON_DIST=$toolRoot\electron"
          Add-Content $env:GITHUB_ENV "ELECTRON_BUILDER_NSIS_DIR=$toolRoot\nsis\nsis-bundle"
      - run: npm run build:windows
      - name: Check native Windows startup
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath 'work/windows/win-unpacked/Quiet Shelf.exe' -ArgumentList @('--disable-gpu', '--remote-debugging-port=9222') -PassThru
          try {
            Start-Sleep -Seconds 12
            $appProcess.Refresh()
            if ($appProcess.HasExited) { throw 'Quiet Shelf exited during startup.' }
            if ($appProcess.MainWindowHandle -eq 0) { throw 'Quiet Shelf did not create its native window.' }
            if ($appProcess.MainWindowTitle -ne 'Quiet Shelf') { throw 'Unexpected application window title.' }
            node scripts/check-native-ui.mjs
            if ($LASTEXITCODE -ne 0) { throw 'The native update indicator check failed.' }
          } finally {
            if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
          }
      - name: Keep update indicator previews briefly
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quiet-shelf-update-previews
          retention-days: 1
          if-no-files-found: error
          path: |
            work/windows/update-preview-*.png
            work/windows/account-preview-*.png
      - name: Check installed update and restart
        shell: pwsh
        run: ./scripts/check-windows-update.ps1
      - uses: actions/upload-artifact@v7.0.2
        id: installer
        with:
          name: quiet-shelf-windows
          retention-days: 1
          if-no-files-found: error
          path: |
            work/windows/Quiet-Shelf-Setup-*-x64.exe
            work/windows/SHA256SUMS.txt

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: quiet-shelf-windows
          path: release
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(node -p "require('./release-state.json').isDraft")" != true ]; then
              echo 'This version is already published; preserving its installer. Bump the version to release an update.'
              exit 0
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Quiet Shelf $version — Windows app" --notes-file desktop/RELEASE-NOTES.md
          fi
          gh release upload "$tag" release/*.exe release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file desktop/RELEASE-NOTES.md
      - name: Remove temporary build artifact after publishing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        shell: bash
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
